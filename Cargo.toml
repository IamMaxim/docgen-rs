[workspace]
resolver = "2"
members = ["crates/docgen-config", "crates/docgen-components", "crates/docgen-core", "crates/docgen-diff", "crates/docgen-assets", "crates/docgen-render", "crates/docgen-build", "crates/docgen-server", "crates/docgen-init", "crates/docgen", "crates/docgen-s3", "crates/docgen-plantuml", "crates/docgen-bases", "crates/docgen-lint"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.10.0"
repository = "https://github.com/IamMaxim/docgen-rs"
readme = "README.md"
authors = ["Maxim Stepanov"]
rust-version = "1.74"

[workspace.dependencies]
# Every internal entry MUST carry a version: crates.io rejects publishes whose
# path dependencies have no version requirement (release-plz keeps these in
# sync with [workspace.package] on release PRs — keep them in sync on manual
# version bumps too; dropping the fields made the 0.10.0 release unpublishable).
docgen-config = { version = "0.10.0", path = "crates/docgen-config" }
docgen-components = { version = "0.10.0", path = "crates/docgen-components" }
docgen-core = { version = "0.10.0", path = "crates/docgen-core" }
docgen-diff = { version = "0.10.0", path = "crates/docgen-diff" }
docgen-assets = { version = "0.10.0", path = "crates/docgen-assets" }
docgen-render = { version = "0.10.0", path = "crates/docgen-render" }
docgen-build = { version = "0.10.0", path = "crates/docgen-build" }
docgen-server = { version = "0.10.0", path = "crates/docgen-server" }
docgen-init = { version = "0.10.0", path = "crates/docgen-init" }
docgen-s3 = { version = "0.10.0", path = "crates/docgen-s3" }
docgen-plantuml = { version = "0.10.0", path = "crates/docgen-plantuml" }
docgen-bases = { version = "0.10.0", path = "crates/docgen-bases" }
docgen-lint = { version = "0.10.0", path = "crates/docgen-lint" }
globset = "0.4"
