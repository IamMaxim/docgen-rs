[workspace]
resolver = "2"
members = ["crates/docgen-config", "crates/docgen-components", "crates/docgen-core", "crates/docgen-diff", "crates/docgen-assets", "crates/docgen-render", "crates/docgen-build", "crates/docgen-server", "crates/docgen-init", "crates/docgen", "crates/docgen-s3", "crates/docgen-plantuml", "crates/docgen-bases", "crates/docgen-lint"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.10.0"
repository = "https://github.com/IamMaxim/docgen-rs"
readme = "README.md"
authors = ["Maxim Stepanov"]
rust-version = "1.74"

[workspace.dependencies]
docgen-config = { path = "crates/docgen-config" }
docgen-components = { path = "crates/docgen-components" }
docgen-core = { path = "crates/docgen-core" }
docgen-diff = { path = "crates/docgen-diff" }
docgen-assets = { path = "crates/docgen-assets" }
docgen-render = { path = "crates/docgen-render" }
docgen-build = { path = "crates/docgen-build" }
docgen-server = { path = "crates/docgen-server" }
docgen-init = { path = "crates/docgen-init" }
docgen-s3 = { path = "crates/docgen-s3" }
docgen-plantuml = { path = "crates/docgen-plantuml" }
docgen-bases = { path = "crates/docgen-bases" }
docgen-lint = { path = "crates/docgen-lint" }
globset = "0.4"
